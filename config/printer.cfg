#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

#[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
#home_xy_position: 144, 253    # 135,245
#speed:100
#z_hop:10
[homing_override]
gcode:
  {% set svv = printer.save_variables.variables %}
   {% set active_tool = printer["gcode_macro VAR"].active_tool %}
  G4 P250
  G1 Z5 F600
  {% if active_tool == 0 %}
    SET_VELOCITY_LIMIT ACCEL=1500
    G28 X
    RESPOND TYPE=command MSG="x homed "
    G28 Y
     RESPOND TYPE=command MSG="Y homed "
     SET_VELOCITY_LIMIT ACCEL=7500
    G1 X144 Y252 F6000
    G28 Z
  {% else %}
    {% if active_tool == 5 %} 
      SET_VELOCITY_LIMIT ACCEL=1500
      G28 X
      RESPOND TYPE=command MSG="x homed "
      G28 Y
      RESPOND TYPE=command MSG="Y homed "
      SET_VELOCITY_LIMIT ACCEL=7500
    {% else %}
      SET_VELOCITY_LIMIT ACCEL=1500
      G28 X
      RESPOND TYPE=command MSG="x homed "
      G28 Y
      RESPOND TYPE=command MSG="Y homed "
      SET_VELOCITY_LIMIT ACCEL=7500
      dock_tool
    {% endif %}
    PICK_UP_TOOL TOOL=0
  {% endif %}
  G1 X144 Y252 F6000
  G28 Z
  G1 X125 Y250 Z10 F1500

  
axes: xyz
set_position_z:0

[z_tilt]
z_positions:
    -50, 18
    125, 298
    300, 18
points:
    5, 5
    100, 195
    195, 5
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

